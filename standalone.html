 yang tak terlupakan sambil menjaga ekosistem laut tetap lestari.",history:"Didirikan pada tahun 2015, area ini awalnya merupakan pesisir tersembunyi yang belum terjamah. Melalui inisiatif komunitas lokal dan pecinta alam, pesisir ini direvitalisasi dan perlahan dikembangkan menjadi kawasan wisata berkelanjutan (sustainable tourism) pada tahun 2018. Kini, Oceana Vibe menjadi salah satu ikon wisata pantai paling diminati tanpa menghilangkan keasrian aslinya.",profileImg:"./logo-oceana-vibe.png",heroImg:"./hero-beach-sunset.jpg",links:{instagram:"https://www.instagram.com/solusilokal.id",maps:"https://www.google.com/maps/search/Palangka+Raya",facebook:"https://facebook.com/",tiktok:"https://www.tiktok.com/@solusilokal.id"},locationHighlights:[{time:"45 Menit",place:"Dari Pusat Kota"},{time:"Akses",place:"Jalan Aspal"},{time:"Parkir",place:"Luas & Aman"}],packages:[{name:"Beach Pass (Reguler)",price:"Rp 50.000",desc:"Tiket masuk area pantai utama, akses bilas gratis, dan 1 botol air mineral.",icon:"Sun",img:"./galeri-beach-pass.webp"},{name:"Relax & Chill",price:"Rp 150.000",desc:"Tiket masuk, akses private gazebo, kursi jemur (sunbed), dan welcome drink kelapa muda segar.",icon:"Umbrella",img:"./galeri-relax-chill.webp"},{name:"Ocean Explorer",price:"Rp 350.000",desc:"Tiket masuk, set alat snorkeling, pemandu lokal, tiket perahu glass-bottom, dan makan siang.",icon:"Waves",img:"./galeri-ocean-explorer.webp"},{name:"Sunset BBQ Camp",price:"Rp 500.000",desc:"Akses camping ground (termasuk tenda 2 pax), paket seafood BBQ, dan area api unggun.",icon:"Anchor",img:"./galeri-sunset-camp.webp"}],galleryPhotos:[{src:"./galeri-beach-pass.webp",title:"Pantai Pasir Putih & Laut Jernih",tag:"Beach Pass"},{src:"./galeri-relax-chill.webp",title:"Private Gazebo & Kelapa Muda Segar",tag:"Relax & Chill"},{src:"./galeri-ocean-explorer.webp",title:"Snorkeling Terumbu Karang & Penyu",tag:"Ocean Explorer"},{src:"./galeri-sunset-camp.webp",title:"Sunset BBQ Camping & Api Unggun",tag:"Sunset
